<head>

  <title>Inscrição confirmada! · Live Expedição Japão 2027</title>

  <!--
    POR QUE ESTA PÁGINA EXISTE

    A conversão do Meta não é disparada por evento do dataLayer: medido em
    26/08, nenhuma tag do container escuta `expedicao_lead` nem `live_lead`.
    Quem conta é o **pageview desta URL** (`/obrigado.html`) — é assim nas LPs
    de expedição, e o mesmo trigger funciona em domínio .vercel.app.

    Por isso o formulário manda o lead para cá antes da comunidade: o pageview
    aqui aciona a tag, e os ~3s de contagem dão tempo do GTM/Stape despachar
    antes de a aba trocar de site.

    O link da comunidade vem do sessionStorage (gravado pelo FormularioLive), e
    não fica escrito aqui, para não haver dois lugares com a mesma URL podendo
    divergir. Se o storage falhar (aba anônima), cai no botão manual.
  -->

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09282B;
      color: #F8F6F7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #fff;
      color: #09282B;
      border-radius: 28px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }
    .check {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #D7F264;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      font-size: 28px; font-weight: 700;
    }
    h1 { font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
    p.sub { color: rgba(9, 40, 43, 0.7); line-height: 1.55; font-size: 14px; margin-bottom: 24px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #D7F264; color: #09282B;
      font-weight: 600; font-size: 15px; text-decoration: none;
      padding: 15px 24px; border-radius: 999px;
      transition: background .2s, transform .2s;
    }
    .btn:hover { background: #C0E046; transform: scale(1.02); }
    .aviso { margin-top: 14px; font-size: 12px; color: rgba(9, 40, 43, 0.5); line-height: 1.5; }
    .marca { margin-top: 26px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(9, 40, 43, 0.35); }
  </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://load.stape-japao.setuforeuvouviagens.com.br/ns.html?id=GTM-W48Q7JG9" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

  <main class="card">
    <div class="check">✓</div>
    <h1 id="titulo">Inscrição confirmada!</h1>
    <p class="sub" id="subtitulo">
      Estamos te levando para a nossa comunidade no WhatsApp — é por lá que o link da live é enviado.
    </p>
    <a class="btn" id="btn-comunidade" href="https://chat.whatsapp.com/BQmxhBuEF5DAO27XkP50xK">
      Entrar na comunidade agora <span id="contagem"></span>
    </a>
    <p class="aviso" id="aviso-email">O link da live é enviado na comunidade do WhatsApp.</p>
    <div class="marca">Se Tu For, Eu Vou! · Viagens</div>
  </main>

  <script>
    (function () {
      // ESTA PÁGINA SERVE AS DUAS LIVES, de propósito: o gatilho de conversão no
      // GTM é o pageview DESTA URL. Uma /obrigado-peru.html separada não seria
      // contada. Quem diz de quem é o inscrito é o `?live=` que o formulário
      // acrescenta; sem ele (link colado à mão, aba antiga) o padrão é o Japão,
      // que é quem vive na raiz do domínio.
      function param(nome) {
        try {
          return new URLSearchParams(window.location.search).get(nome) || '';
        } catch (e) { return ''; }
      }

      var SLUG = param('live') || 'japao-live';
      // Link de emergência de quem cai aqui com o sessionStorage vazio (aba
      // anônima, onde o formulário não conseguiu gravar nada).
      //
      // ⚠️ CADA LIVE COM O SEU GRUPO. Cair no grupo errado é pior do que não
      // cair em grupo nenhum — por isso live que não estiver neste mapa fica
      // sem redirect, e a página vira só a confirmação.
      //
      // Estes links são cópia dos `comunidade.url` de src/data/live-*.ts.
      // Trocou lá, troque aqui: fora de sincronia não dá erro nenhum, só manda
      // a aba anônima para o lugar errado.
      var PADRAO_POR_LIVE = {
        'japao-live': 'https://chat.whatsapp.com/BQmxhBuEF5DAO27XkP50xK',
        'peru-live': 'https://chat.whatsapp.com/JGzOfTsgNsm0HlCawBArCQ',
        // ⚠️ PREENCHER quando o grupo de cada live for criado. Enquanto estiver
        // vazio a página vira só a confirmação (sem botão, sem contagem) — que é
        // o comportamento certo: cair no grupo errado é pior do que não cair em
        // grupo nenhum. O MESMO link precisa ir para o `comunidade.url` do
        // src/data/live-<rota>.ts correspondente.
        'costa-amalfitana-live': '',
        'tailandia-live': '',
        'turquia-live': '',
        'islandia-live': '',
        'egito-live': ''
      };
      var PADRAO = PADRAO_POR_LIVE[SLUG] || '';
      var SEGUNDOS = 3;

      // A página é noindex e dura 3 segundos, mas o título aparece na aba e no
      // histórico — deixar "Japão" para quem se inscreveu no Egito é confuso.
      // O padrão (Japão) já está escrito no <title> do HTML.
      var TITULO_POR_LIVE = {
        'peru-live': 'Peru 2027',
        'costa-amalfitana-live': 'Costa Amalfitana 2027',
        'tailandia-live': 'Tailândia 2027',
        'turquia-live': 'Turquia & Grécia 2027',
        'islandia-live': 'Islândia 2027',
        'egito-live': 'Egito 2027'
      };
      if (TITULO_POR_LIVE[SLUG]) {
        document.title = 'Inscrição confirmada! · Live Expedição ' + TITULO_POR_LIVE[SLUG];
      }

      function ler(chave) {
        try { return sessionStorage.getItem(chave); } catch (e) { return null; }
      }

      // Dados gravados pelo formulário antes de mandar o lead para cá.
      var destino = ler(SLUG + '_comunidade') || PADRAO;
      var bruto = ler(SLUG + '_enviado');
      var dados = null;
      try { dados = bruto ? JSON.parse(bruto) : null; } catch (e) {}

      if (dados && dados.nome) {
        document.getElementById('titulo').textContent =
          'Inscrição confirmada, ' + String(dados.nome).trim().split(' ')[0] + '!';
      }

      // Sem grupo configurado (live nova, `comunidade.url` ainda vazio) a
      // página vira só a confirmação: some o botão, some a contagem e ninguém é
      // redirecionado. O pageview — que é o que conta a conversão — já
      // aconteceu de qualquer jeito.
      var btn = document.getElementById('btn-comunidade');
      if (!destino) {
        btn.style.display = 'none';
        document.getElementById('aviso-email').textContent =
          'O convite da live chega no e-mail que você informou.';
        document.getElementById('subtitulo').textContent =
          'Inscrição registrada. O convite com o link da sala vai para o seu e-mail.';
        return;
      }
      btn.href = destino;

      var restante = SEGUNDOS;
      var span = document.getElementById('contagem');
      span.textContent = '(' + restante + ')';
      var t = setInterval(function () {
        restante -= 1;
        span.textContent = restante > 0 ? '(' + restante + ')' : '';
        if (restante <= 0) {
          clearInterval(t);
          // replace: voltar do WhatsApp cai na LP, não nesta página
          window.location.replace(destino);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
