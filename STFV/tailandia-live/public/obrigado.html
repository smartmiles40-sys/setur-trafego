  <title>Inscrição confirmada! · Live Expedição Japão 2027</title>

  <!--
    POR QUE ESTA PÁGINA EXISTE

    A conversão do Meta não é disparada por evento do dataLayer: medido em
    26/08, nenhuma tag do container escuta `expedicao_lead` nem `live_lead`.
    Quem conta é o **pageview desta URL** (`/obrigado.html`) — é assim nas LPs
    de expedição, e o mesmo trigger funciona em domínio .vercel.app.

    Por isso o formulário manda o lead para cá antes da comunidade: o pageview
    aqui aciona a tag, e os ~3s de contagem dão tempo do GTM/Stape despachar
    antes de a aba trocar de site.

    O link da comunidade vem do sessionStorage (gravado pelo FormularioLive), e
    não fica escrito aqui, para não haver dois lugares com a mesma URL podendo
    divergir. Se o storage falhar (aba anônima), cai no botão manual.
  -->

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09282B;
      color: #F8F6F7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #fff;
      color: #09282B;
      border-radius: 28px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }
    .check {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #D7F264;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      font-size: 28px; font-weight: 700;
    }
    h1 { font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
    p.sub { color: rgba(9, 40, 43, 0.7); line-height: 1.55; font-size: 14px; margin-bottom: 24px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #D7F264; color: #09282B;
      font-weight: 600; font-size: 15px; text-decoration: none;
      padding: 15px 24px; border-radius: 999px;
      transition: background .2s, transform .2s;
    }
    .btn:hover { background: #C0E046; transform: scale(1.02); }
    .aviso { margin-top: 14px; font-size: 12px; color: rgba(9, 40, 43, 0.5); line-height: 1.5; }
    .marca { margin-top: 26px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(9, 40, 43, 0.35); }
  </style>

<body>
    <!-- Google Tag Manager (noscript) -->

  <main class="card">
    <div class="check">✓</div>
    <h1 id="titulo">Inscrição confirmada!</h1>
    <p class="sub">
      Estamos te levando para a nossa comunidade no WhatsApp — é por lá que o link da live é enviado.
    </p>
    <a class="btn" id="btn-comunidade" href="https://chat.whatsapp.com/GApX2oeJUl3HeS4elpqbUq">
      Entrar na comunidade agora <span id="contagem"></span>
    </a>
    <p class="aviso" id="aviso-email">O link da live é enviado na comunidade do WhatsApp.</p>
    <div class="marca">Se Tu For, Eu Vou! · Viagens</div>
  </main>

  <script>
    (function () {
      var SLUG = 'japao-live';
      var PADRAO = 'https://chat.whatsapp.com/GApX2oeJUl3HeS4elpqbUq';
      var SEGUNDOS = 3;

      function ler(chave) {
        try { return sessionStorage.getItem(chave); } catch (e) { return null; }
      }

      // Dados gravados pelo formulário antes de mandar o lead para cá.
      var destino = ler(SLUG + '_comunidade') || PADRAO;
      var bruto = ler(SLUG + '_enviado');
      var dados = null;
      try { dados = bruto ? JSON.parse(bruto) : null; } catch (e) {}

      if (dados && dados.nome) {
        document.getElementById('titulo').textContent =
          'Inscrição confirmada, ' + String(dados.nome).trim().split(' ')[0] + '!';
      }

      var restante = SEGUNDOS;
      var span = document.getElementById('contagem');
      span.textContent = '(' + restante + ')';
      var t = setInterval(function () {
        restante -= 1;
        span.textContent = restante > 0 ? '(' + restante + ')' : '';
        if (restante <= 0) {
          clearInterval(t);
          // replace: voltar do WhatsApp cai na LP, não nesta página
          window.location.replace(destino);
        }
      }, 1000);
    })();
  </script>
