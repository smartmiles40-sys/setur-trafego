    <!--
      18/11/2026 (Bruno): VOLTOU o fluxo "preencheu o formulário → WhatsApp".
      Sai a agenda com o SDR (22/10). A pessoa manda a PRIMEIRA mensagem pra
      SDR que é DONA dela no QS:
        • durante os 3 s desta página (tempo da Stape/GTM contar a conversão
          desta visita), ela pergunta ao QS (/api/lead) de quem é o telefone;
        • o QS devolve a dona (carteira/bilhete já existente) ou escolhe pela
          distribuição e grava o bilhete — quando o lead chega no QS pelo
          Bitrix, o gatilho trg_qs_assign_owner dá o card pra MESMA SDR;
        • abre o wa.me dela com a mensagem pronta do formulário.
      QS fora do ar ou lento (> 3,5 s): não redireciona pra ninguém escolhido
      no chute; mostra o botão (que tenta de novo) e o time chama pelo QS.
    -->
    <a class="voltar" href="./">← Voltar para a página do pacote</a>

  <script>
    (function () {
      var DISTRIBUIDOR = 'https://qs-turis.vercel.app/api/lead';
      var ROTA_FORM = 'https://qs-turis.vercel.app/api/whatsapp';
      var ESPERA_MAX_MS = 3500;
      var SEGUNDOS = 3;
      var MSG_PADRAO = 'Quero seguir os próximos passos';

      function ler(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
      function gravar(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
      function apagar(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
      function json(k) { try { return JSON.parse(ler(k) || 'null'); } catch (e) { return null; } }
      function valido(n) {
        var s = String(n || '');
        return /^[0-9]{12,13}$/.test(s) && s !== '5511951251935' ? s : null;
      }

      // Dados do lead: o formulário das expedições grava stfv_wa_lead + a
      // mensagem pronta; o do pacote só grava stfv_agenda.
      var agenda = json('stfv_agenda');
      var lead = json('stfv_wa_lead') || (agenda && agenda.telefone ? {
        nome: agenda.nome, telefone: agenda.telefone, expedicao: agenda.expedicao, origem: agenda.origem
      } : null);
      var msg = ler('stfv_wa_msg') || (lead && lead.nome
        ? 'Olá! Sou ' + lead.nome + ' e acabei de preencher o formulário sobre ' + (lead.expedicao || 'a viagem') + '. Quero seguir os próximos passos.'
        : MSG_PADRAO);
      var numero = valido(ler('stfv_wa_numero'));

      var btn = document.getElementById('btn-whatsapp');
      var aviso = document.getElementById('aviso-redirect');
      var contagem = document.getElementById('contagem');
      function link() { return numero ? 'https://wa.me/' + numero + '?text=' + encodeURIComponent(msg) : null; }
      function mostrarBotao() {
        if (!btn) return;
        btn.hidden = false;
        btn.href = link() || (ROTA_FORM + '?text=' + encodeURIComponent(msg));
      }
      function dl(evento, extra) {
        window.dataLayer = window.dataLayer || [];
        var o = { event: evento };
        for (var k in extra) o[k] = extra[k];
        window.dataLayer.push(o);
      }

      function perguntar(cb) {
        if (!lead || !lead.telefone || !window.fetch) return cb(null);
        var feito = false;
        function fim(n) { if (feito) return; feito = true; cb(valido(n)); }
        var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var limite = setTimeout(function () { if (ctrl) ctrl.abort(); fim(null); }, ESPERA_MAX_MS);
        fetch(DISTRIBUIDOR, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(lead),
          signal: ctrl ? ctrl.signal : undefined
        })
          .then(function (r) { return r.json(); })
          .then(function (d) { clearTimeout(limite); fim(d && d.numero); })
          .catch(function () { clearTimeout(limite); fim(null); });
      }

      // Quem volta do WhatsApp (ou abre a página direto) só vê o botão.
      if (!lead) { if (numero) mostrarBotao(); return; }
      // Uma vez só: voltar do WhatsApp não pode virar laço.
      apagar('stfv_wa_lead'); apagar('stfv_agenda');

      var decidido = false, acabou = false;
      function ir() {
        if (!numero) {
          // Sem dona definida: não chuta número. Botão tenta de novo no clique.
          if (aviso) aviso.hidden = true;
          mostrarBotao();
          dl('whatsapp_sem_numero', {});
          return;
        }
        dl('whatsapp_redirect', { sdr_numero_final: numero.slice(-4) });
        window.location.replace(link()); // voltar do WhatsApp cai na LP
      }
      perguntar(function (n) {
        decidido = true;
        if (n) { numero = n; gravar('stfv_wa_numero', n); }
        if (acabou) ir();
      });
      if (btn) btn.addEventListener('click', function (e) {
        if (numero) return;
        e.preventDefault();
        perguntar(function (n) {
          if (n) { numero = n; gravar('stfv_wa_numero', n); window.location.href = link(); }
          else window.location.href = ROTA_FORM + '?text=' + encodeURIComponent(msg);
        });
      });

      if (aviso) aviso.hidden = false;
      var restante = SEGUNDOS;
      var timer = setInterval(function () {
        restante -= 1;
        if (contagem) contagem.textContent = Math.max(restante, 0);
        if (restante <= 0) { clearInterval(timer); acabou = true; if (decidido) ir(); }
      }, 1000);
    })();
  </script>
